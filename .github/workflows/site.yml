name: Public Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci
      - run: npm ci --prefix studio
      - name: Build the public site and standalone editor
        env:
          PUBLIC_SITE_URL: https://studio.hanko.sh/
          NPM_AVAILABLE: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: npm run website:build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run website:test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the qualified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
