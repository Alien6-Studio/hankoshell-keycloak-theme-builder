name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; for (const path of ["package.json", "studio/package.json"]) if (`v${JSON.parse(fs.readFileSync(path)).version}` !== process.env.RELEASE_TAG) process.exit(1)'
      - run: npm run build
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: example-theme
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: theme-studio
          path: studio-candidate
      - name: Include the editor and standalone site
        run: |
          cp studio-candidate/release/*.tgz studio-candidate/release/*-site.zip artifacts/
          cp studio-candidate/release/manifest.json artifacts/theme-studio-manifest.json
          cd artifacts
          sha256sum *.tgz *.jar *.json *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes
      - name: Publish to npm through its configured trusted publisher
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-*) dist_tag=preview ;;
            *) dist_tag=latest ;;
          esac
          npm publish artifacts/alien6-hankoshell-keycloak-theme-builder-*.tgz --provenance --access public --tag "$dist_tag"
          npm publish artifacts/alien6-hankoshell-theme-studio-*.tgz --provenance --access public --tag "$dist_tag"
